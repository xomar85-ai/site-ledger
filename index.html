<style>
:root{--b1:#0F3A26;--b1l:#14452D;--b1l2:#1A5237;--b1d:#0A2A1B;--b2:#D5B46A;--b2d:#B08A3A;--b2dd:#7A5E22;--b2l:#E6C98A;--b3:#C65332}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;font-size:16px}

.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}

input,select{flex:1;min-width:120px}
button{background:var(--pri);color:#fff;border:0;cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.acc{background:var(--acc);color:var(--b1)}
.in{color:var(--in)}.out{color:var(--out)}
.kv{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--bd)}
.kv:last-child{border:0}
.kv.big{font-size:19px;font-weight:bold;border-top:2px solid var(--bd);margin-top:4px}

.tr small{color:var(--mu);display:block;font-size:12.5px}
.x{background:none;color:var(--mu);padding:4px 8px;font-size:20px}
.tabs{display:flex;gap:8px;margin-bottom:8px}
.tabs button{flex:1}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}

.chips button.on{background:var(--pri);color:#fff}
.empty{color:var(--mu);text-align:center;padding:14px}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}.menu button{background:var(--card);color:var(--tx);border:1px solid var(--bd);text-align:right}.menu button.on{background:var(--pri);color:#fff;border-color:var(--pri)}.tq{font-size:13px;color:var(--mu);padding:2px 0 8px;line-height:1.6}
.pr{display:none}

 :root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#fff;--card:#fff;--tx:#000;--mu:#444;--bd:#bbb;--in:var(--b3);--out:#a11}
 .np{display:none!important}.pr{display:block}.card{break-inside:avoid}
 .hd{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

.hd{display:flex;align-items:center;gap:12px}.mb{background:rgba(255,255,255,.18);font-size:22px;padding:6px 12px}

.card{border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.12)}

.cv{min-height:250px;padding-bottom:120px}

.sr{position:fixed;inset:0;background:var(--bg);color:var(--tx);z-index:45;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 24px}

.land{min-height:calc(100vh - 32px);display:flex;flex-direction:column;padding:34px 20px 0}

function hdPayCheck(ci,nm,agId,amt,ex){var c=S.clients[ci];if(!c||!nm)return{lvl:0};var arr=hdAgreements(c,nm);if(!arr.length)return{lvl:0};
var list=agId?arr.filter(function(a){return a.id===agId}):arr;if(!list.length)return{lvl:0};
var val=0,ern=0,paid;list.forEach(function(a){val+=hdAgValue(a);ern+=hdAgEarned(a)});

if(after>ern+.005)return{lvl:1,msg:"⚠ هذه الدفعة تتخطى قيمة الشغل المنفذ فعليًا ("+lb+").\nقيمة المنفذ: "+m(ern)+"\nالمدفوع بعد هذه الدفعة: "+m(after)+"\nزيادة عن المنفذ (دفعة مقدمة): "+m(after-ern)+"\nلو الصنايعي أنجز أكتر، حدّث الكمية المنفذة أولًا."};
return{lvl:0}}
